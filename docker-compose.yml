# The whole stack: Redis, the API and the Streamlit client.
#
#   docker compose up --build      # build and start everything
#   docker compose logs -f api     # follow the API
#   docker compose down            # stop it
#
# `.:/srv/app` bind-mounts the source into both containers, so edits to Python
# files apply live: uvicorn reloads the API, Streamlit re-runs the page on save.
# Changes to pyproject.toml, uv.lock or the Dockerfile need `--build`.
#
# Host ports are overridable, defaulting to the usual ones:
#   API_PORT=8001 STREAMLIT_PORT=8502 docker compose up

services:
  redis:
    # Redis Stack ships RediSearch, which redisvl needs for the semantic cache's
    # vector queries. Vanilla ``redis:7-alpine`` lacks it, so the semantic cache
    # would stay a permanent no-op. The dependency probe still degrades to a
    # no-op when the module (or an OPENAI_API_KEY for embeddings) is absent.
    image: redis/redis-stack:7.4.0-v0
    ports:
      - "${REDIS_PORT:-6379}:6379"
      - "${REDIS_INSIGHT_PORT:-8001}:8001"  # RedisInsight UI
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    # Apply pending migrations, then serve. The bind mount makes alembic/ and
    # alembic.ini available; a standalone image copies them explicitly.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"
    environment:
      REDIS_URL: redis://redis:6379
      # Compose uses Postgres; the host default is a SQLite file (see .env.example).
      DATABASE_URL: postgresql+psycopg://estimator:estimator@postgres:5432/estimator
      # Windows bind mounts do not emit inotify events, so poll for changes.
      WATCHFILES_FORCE_POLLING: "true"
    env_file:
      - .env
    volumes:
      - .:/srv/app
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Postgres for the ingestion persistence layer (jobs + pseudonym mappings).
  # pgvector ships in the image so the retrieval phase does not need a new
  # service; the extension is NOT enabled yet. Host port 5433 avoids colliding
  # with any local Postgres on 5432.
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: estimator
      POSTGRES_PASSWORD: estimator
      POSTGRES_DB: estimator
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estimator -d estimator"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  streamlit:
    build: .
    command: streamlit run streamlit_app_loader.py
    environment:
      ESTIMATOR_API_BASE_URL: http://api:8000
      # Set through the environment rather than CLI flags: Streamlit's config
      # precedence reads these, so `streamlit config show` can confirm them.
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_RUN_ON_SAVE: "true"
      # Windows bind mounts do not emit inotify events, so poll for changes.
      STREAMLIT_SERVER_FILE_WATCHER_TYPE: poll
    volumes:
      - .:/srv/app
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    depends_on:
      - api

volumes:
  postgres_data:

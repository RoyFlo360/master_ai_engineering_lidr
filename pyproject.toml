[project]
name = "master-ai-engineering-lidr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "rodrigo.flores@storicard.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "instructor",
    "jinja2>=3.1.6",
    "litellm>=1.83.0",
    "openai<3.13",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
    "redisvl>=0.27.2",
    "sse-starlette>=3.4.11",
    "streamlit>=1.64.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
master-ai-engineering-lidr = "master_ai_engineering_lidr:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

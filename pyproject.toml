[project]
name = "master-ai-engineering-lidr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "rodrigo.flores@storicard.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "fpdf2>=2.7.9",
    "instructor",
    "jinja2>=3.1.6",
    "litellm>=1.83.0",
    "openai>=1.0.0,<3.13",
    # Session 7 — embedding pipeline: token counting for the structural chunker.
    "tiktoken>=0.7.0",
    # Session 7 — data ingestion: catalog, cleaning, PII, persistence.
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pandas>=2.2",
    "pandera>=0.20",
    "openpyxl>=3.1",
    "faker>=24.0",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
    # Spanish NER model. spaCy models are not on PyPI as importable packages, so
    # this is a pinned wheel from the explosion releases. Without it Presidio
    # silently misses Hispanic names and ingestion degrades to the regex
    # fallback (emails/ids only, never PERSON). Declared here — rather than left
    # as a `spacy download` step — so the host venv, CI and the image all get it.
    "es-core-news-md @ https://github.com/explosion/spacy-models/releases/download/es_core_news_md-3.8.0/es_core_news_md-3.8.0-py3-none-any.whl",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
    "redisvl>=0.27.2",
    "sse-starlette>=3.4.11",
    "streamlit>=1.64.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.53.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "langchain-text-splitters>=0.3.0",
    "nltk>=3.9",
    "langchain-experimental>=0.3.0",
    "langchain-openai>=0.2.0",
    "anthropic>=0.40",
]

[project.scripts]
master-ai-engineering-lidr = "master_ai_engineering_lidr:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "postgres: needs a real database via TEST_DATABASE_URL (skipped otherwise)",
]
